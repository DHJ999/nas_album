name: nas_album
description: "NAS相册 —— 兼容 fnOS 的第三方相册客户端"
publish_to: 'none'
version: 1.1.3+22

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 签名（MD5）
  crypto: ^3.0.5

  # 会话 / 偏好持久化
  shared_preferences: ^2.3.3

  # 保存图片到本机
  path_provider: ^2.1.5

  # 视频 / 实况照片播放
  video_player: ^2.9.2

  # 本机相册：权限 + 按文件名匹配 + 删除本机副本
  photo_manager: ^3.12.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
